[project]
name = "ai-knowledge-assistant"
version = "1.0.0"
description = "Production-grade RAG Knowledge Base Assistant with free open-source LLM via HuggingFace Inference API, Vector Search, Reranking & Observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- LLM & Orchestration ---
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "langgraph>=0.2",
    # --- Embeddings & Vector Store ---
    "chromadb>=0.5",
    # --- Document Processing ---
    "unstructured[pdf]>=0.16",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "python-pptx>=1.0",
    # --- Reranking ---
    "flashrank>=0.2",
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    # --- UI ---
    "streamlit>=1.40",
    # --- Observability & Evaluation ---
    "langsmith>=0.2",
    "ragas>=0.2",
    # --- Utilities ---
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
    "loguru>=0.7",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
